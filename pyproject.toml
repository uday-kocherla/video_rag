[project]
name = "vrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.24",  # artifact store: snapshot_download / upload_folder
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
